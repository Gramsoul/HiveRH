spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: HiveRH
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

hiverh:
  auth:
    refresh-token-expiration-ms: ${REFRESH_EXPIRATION:28800000}
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME:hiverh_refresh}
      path: /api/auth
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    cors:
      allowed-origins: ${FRONTEND_ORIGINS:http://localhost:4200}
  demo-cleanup:
    enabled: ${DEMO_CLEANUP_ENABLED:false}
    daily-cron: "${DEMO_CLEANUP_DAILY_CRON:0 0 4 * * *}"
    zone: ${DEMO_CLEANUP_ZONE:UTC}
    max-records: ${DEMO_CLEANUP_MAX_RECORDS:5000}
    threshold-initial-delay-ms: ${DEMO_CLEANUP_THRESHOLD_INITIAL_DELAY_MS:300000}
    threshold-check-delay-ms: ${DEMO_CLEANUP_THRESHOLD_CHECK_DELAY_MS:900000}
    include-catalog-data: ${DEMO_CLEANUP_INCLUDE_CATALOG_DATA:false}
    preserved-account-users: ${DEMO_CLEANUP_PRESERVED_ACCOUNT_USERS:admin}
